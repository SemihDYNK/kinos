# appimage-builder recipe see https://appimage-builder.readthedocs.io for details
# appimage-builder --recipe AppImageBuilder.yml
# wget -O appimage-builder-x86_64.AppImage https://github.com/AppImageCrafters/appimage-builder/releases/download/v1.1.0/appimage-builder-1.1.0-x86_64.AppImage
# chmod +x appimage-builder-x86_64.AppImage

# # install (optional)
# sudo mv appimage-builder-x86_64.AppImage /usr/local/bin/appimage-builder
version: 1
script:
  - rm -rf AppDir || true
  - cp -r build/linux/x64/release/bundle AppDir
  - mkdir -p AppDir/usr/share/icons/
  - cp icons/production/kinos_icon_desktop.png AppDir/usr/share/icons/
AppDir:
  path: ./AppDir
  app_info:
    id: app.kinos
    name: Kinos
    icon: kinos_icon_desktop
    version: latest
    exec: kinos
    exec_args: $@
  files:
    include:
      - assets/fonts/rubik/Rubik-Italic-VariableFont_wght.ttf
      - assets/fonts/rubik/Rubik-VariableFont_wght.ttf
      - icons/production/kinos_icon_desktop.png
AppImage:
  arch: x86_64
  # TODO (hors dépôt) : remplacer DonutWare/Fladder par le propriétaire/dépôt
  # GitHub réels de Kinos une fois publié.
  update-information: gh-releases-zsync|DonutWare|Fladder|latest|Kinos-Linux-*.AppImage.zsync
  file_name: Kinos_x86_64.AppImage
