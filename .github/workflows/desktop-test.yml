name: Kinos desktop tests

on:
  push:
    branches: [main, codex/desktop-test-builds]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      macos_artifact_run:
        description: 'Existing run ID: retest its Mac archive without rebuilding'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name != 'workflow_dispatch' || inputs.macos_artifact_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - name: Install Linux test dependencies
        run: sudo apt-get update && sudo apt-get install -y libmpv-dev libsecret-1-dev libgtk-3-dev
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub --no-fatal-infos
      - run: flutter test --no-pub --reporter expanded --timeout 2m

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.macos_artifact_run == ''
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build portable Windows app
        run: flutter build windows --release --no-pub --build-number=${{ github.run_number }}
      - name: Include license and test instructions
        shell: pwsh
        run: |
          $bundle = 'build/windows/x64/runner/Release'
          if (!(Test-Path "$bundle/kinos.exe")) { throw 'kinos.exe is missing' }
          Copy-Item LICENSE, NOTICE, docs/desktop-testing.md -Destination $bundle
          "Commit: $env:GITHUB_SHA`nSource: https://github.com/$env:GITHUB_REPOSITORY/tree/$env:GITHUB_SHA" | Set-Content "$bundle/BUILD.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: kinos-windows-x64-portable
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

  macos-launch:
    needs: macos
    if: ${{ !cancelled() && (needs.macos.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.macos_artifact_run != '')) }}
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kinos-macos-universal
          path: dist
          run-id: ${{ inputs.macos_artifact_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Launch the extracted app on macOS 26
        run: |
          ditto -x -k dist/kinos-macos-universal.zip dist/extracted
          APP='dist/extracted/Kinos/Kinos.app'
          codesign --verify --deep --strict "$APP"
          python3 - "$APP" <<'PY'
          import pathlib, plistlib, subprocess, sys, tempfile

          app = pathlib.Path(sys.argv[1]).resolve()
          entitlements = plistlib.loads(subprocess.check_output(
              ['codesign', '--display', '--entitlements', '-', '--xml', str(app)]))
          assert 'keychain-access-groups' not in entitlements, (
              'Local builds cannot claim a provisioning-only Keychain group')
          assert 'com.apple.security.app-sandbox' not in entitlements, (
              'An ad hoc sandboxed app cannot persist credentials in Keychain')
          info = plistlib.loads((app / 'Contents/Info.plist').read_bytes())
          executable = app / 'Contents/MacOS' / info['CFBundleExecutable']
          with tempfile.TemporaryFile(mode='w+t') as log:
              process = subprocess.Popen([str(executable)], stdout=log, stderr=subprocess.STDOUT)
              try:
                  status = process.wait(timeout=15)
              except subprocess.TimeoutExpired:
                  print('Kinos remained alive for 15 seconds on macOS 26')
              else:
                  log.seek(0)
                  print(log.read())
                  raise SystemExit(f'Kinos exited during startup: {status}')
              finally:
                  if process.poll() is None:
                      process.terminate()
                      try:
                          process.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          process.kill()
                          process.wait(timeout=5)
          PY

  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.macos_artifact_run == ''
    runs-on: macos-15
    timeout-minutes: 40
    env:
      FLUTTER_MACOS_ARM64_ONLY: 'false'
      FLUTTER_XCODE_CODE_SIGN_IDENTITY: '-'
      FLUTTER_XCODE_CODE_SIGN_STYLE: Manual
      FLUTTER_XCODE_DEVELOPMENT_TEAM: ''
      FLUTTER_XCODE_PROVISIONING_PROFILE_SPECIFIER: ''
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build universal macOS app with local signature
        run: flutter build macos --release --no-pub --flavor production --build-number=${{ github.run_number }}
      - name: Verify and package app
        run: |
          APP='build/macos/Build/Products/Release-production/Kinos.app'
          test -d "$APP"
          lipo "$APP/Contents/MacOS/Kinos" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$APP"
          mkdir -p dist/Kinos
          ditto "$APP" dist/Kinos/Kinos.app
          cp LICENSE NOTICE docs/desktop-testing.md dist/Kinos/
          printf 'Commit: %s\nSource: https://github.com/%s/tree/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA" > dist/Kinos/BUILD.txt
          ditto -c -k --sequesterRsrc --keepParent dist/Kinos dist/kinos-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kinos-macos-universal
          path: dist/kinos-macos-universal.zip
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [checks, windows, macos, macos-launch]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kinos-windows-x64-portable
          path: artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: kinos-macos-universal
          path: artifacts/macos
      - name: Package and checksum release assets
        run: |
          mkdir -p release
          (cd artifacts/windows && zip -qr ../../release/kinos-windows-x64-portable.zip .)
          cp artifacts/macos/kinos-macos-universal.zip release/
          (cd release && sha256sum kinos-windows-x64-portable.zip kinos-macos-universal.zip > SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/kinos-windows-x64-portable.zip \
            release/kinos-macos-universal.zip \
            release/SHA256SUMS.txt \
            --title "Kinos $GITHUB_REF_NAME" \
            --generate-notes
