name: Kinos desktop tests

on:
  push:
    branches: [main, codex/desktop-test-builds]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - name: Install Linux test dependencies
        run: sudo apt-get update && sudo apt-get install -y libmpv-dev libsecret-1-dev libgtk-3-dev
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub --no-fatal-infos
      - run: flutter test --no-pub --reporter expanded --timeout 2m

  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build portable Windows app
        run: flutter build windows --release --no-pub --build-number=${{ github.run_number }}
      - name: Include license and test instructions
        shell: pwsh
        run: |
          $bundle = 'build/windows/x64/runner/Release'
          if (!(Test-Path "$bundle/kinos.exe")) { throw 'kinos.exe is missing' }
          Copy-Item LICENSE, NOTICE, docs/desktop-testing.md -Destination $bundle
          "Commit: $env:GITHUB_SHA`nSource: https://github.com/$env:GITHUB_REPOSITORY/tree/$env:GITHUB_SHA" | Set-Content "$bundle/BUILD.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: kinos-windows-x64-portable
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

  macos:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      FLUTTER_MACOS_ARM64_ONLY: 'false'
      FLUTTER_XCODE_CODE_SIGN_IDENTITY: '-'
      FLUTTER_XCODE_CODE_SIGN_STYLE: Manual
      FLUTTER_XCODE_DEVELOPMENT_TEAM: ''
      FLUTTER_XCODE_PROVISIONING_PROFILE_SPECIFIER: ''
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build universal macOS app with local signature
        run: flutter build macos --release --no-pub --flavor production --build-number=${{ github.run_number }}
      - name: Verify and package app
        run: |
          APP='build/macos/Build/Products/Release-production/Kinos.app'
          test -d "$APP"
          lipo "$APP/Contents/MacOS/Kinos" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$APP"
          mkdir -p dist/Kinos
          ditto "$APP" dist/Kinos/Kinos.app
          cp LICENSE NOTICE docs/desktop-testing.md dist/Kinos/
          printf 'Commit: %s\nSource: https://github.com/%s/tree/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA" > dist/Kinos/BUILD.txt
          ditto -c -k --sequesterRsrc --keepParent dist/Kinos dist/kinos-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kinos-macos-universal
          path: dist/kinos-macos-universal.zip
          if-no-files-found: error
          retention-days: 14
